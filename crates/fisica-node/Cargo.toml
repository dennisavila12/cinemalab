[package]
name = "fisica-node"
description = "Puente nativo (napi) entre el motor de física en Rust y Node.js"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
fisica-core = { path = "../fisica-core" }
napi = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"
